[project]
name = "404nf-routeplan"
version = "0.1.0"
description = "路徑規劃插件 — A*, RRT/RRT*, 多智能體協同規劃、障礙物地圖管理"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "404NotFound-ai", email = "404notfound@example.com" },
]
keywords = ["path-planning", "astar", "rrt", "multi-agent", "nexus-plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Robotics",
]

dependencies = [
    "404nf-sagent>=0.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/404NotFound-ai/404NF-RoutePlan"
Repository = "https://github.com/404NotFound-ai/404NF-RoutePlan.git"
Issues = "https://github.com/404NotFound-ai/404NF-RoutePlan/issues"

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nexus_plugin_path_planning*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
